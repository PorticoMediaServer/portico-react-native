## OpenSSL targets for the Portico media engine on Apple platforms (build-apple.sh).
##
## OpenSSL's own ios64-xcrun and iossimulator-*-xcrun targets pick the SDK and an old minimum OS
## themselves. These inherit the same iOS settings ("ios-common": Darwin shared libraries, no
## async jobs, which need ucontext) and take the compiler, SDK and deployment target from the
## flags build-apple.sh passes, so one definition serves iOS, tvOS and both simulators.

my %targets = (
    "portico-apple-arm64" => {
        inherit_from     => [ "ios-common" ],
        cflags           => add("-fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => "aarch64",
        perlasm_scheme   => "ios64",
    },
    "portico-apple-x86_64" => {
        inherit_from     => [ "ios-common" ],
        cflags           => add("-fno-common"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => "x86_64",
        perlasm_scheme   => "macosx",
    },
);
