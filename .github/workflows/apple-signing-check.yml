name: Apple signing readiness

on:
  workflow_dispatch:
  push:
    branches: [apple-actions-builds]
    paths:
      - '.github/workflows/apple-signing-check.yml'
      - 'scripts/apple-signing-check.sh'

permissions:
  contents: read

jobs:
  signing:
    runs-on: xcode-27
    timeout-minutes: 15
    environment: apple-distribution
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify CI signing access without uploading an app
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.APPLE_IOS_APP_STORE_PROFILE_BASE64 }}
          APPLE_TVOS_APP_STORE_PROFILE_BASE64: ${{ secrets.APPLE_TVOS_APP_STORE_PROFILE_BASE64 }}
          APPLE_TOPSHELF_APP_STORE_PROFILE_BASE64: ${{ secrets.APPLE_TOPSHELF_APP_STORE_PROFILE_BASE64 }}
        run: scripts/apple-signing-check.sh
