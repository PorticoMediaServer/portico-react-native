name: Android and Fire OS builds

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - '.github/workflows/android-builds.yml'
      - 'third_party/media-engine/**'
      - 'apps/native/android/**'
  push:
    branches: [android-vega-actions]
    paths: ['.github/workflows/android-builds.yml', 'third_party/media-engine/**', 'apps/native/android/**']

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  media:
    name: Media engine (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv pkgconf autoconf automake libtool
          rust=$(python3 -c 'import json; print(json.load(open("third_party/media-engine/sources.lock.json"))["tools"]["rust"]["version"])')
          rustup toolchain install "$rust" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$rust" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Build and verify pinned media sources
        env:
          MEDIA_ENGINE_JOBS: '4'
        run: third_party/media-engine/build-android.sh --abis "${{ matrix.abi }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-media-${{ matrix.abi }}
          path: third_party/media-engine/out/android/
          if-no-files-found: error
          retention-days: 7
      - name: Media build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-media-logs-${{ matrix.abi }}
          path: third_party/media-engine/work/logs/
          retention-days: 7

  packages:
    name: Google Android and Fire OS APKs and bundles
    needs: media
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: apps/native/package-lock.json}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: android-media-*
          path: third_party/media-engine/out/android
          merge-multiple: true
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: apps/native
      - name: Build embedded-JavaScript release packages and run JVM tests
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            :app:assembleGoogleRelease :app:assembleFiretvRelease \
            :app:bundleGoogleRelease :app:bundleFiretvRelease \
            :app:testGoogleDebugUnitTest :app:testFiretvDebugUnitTest
        working-directory: apps/native/android
      - name: Collect packages, corresponding source and notices
        run: |
          mkdir -p dist/android
          cp apps/native/android/app/build/outputs/apk/google/release/*.apk dist/android/
          cp apps/native/android/app/build/outputs/apk/firetv/release/*.apk dist/android/
          cp apps/native/android/app/build/outputs/bundle/googleRelease/*.aab dist/android/
          cp apps/native/android/app/build/outputs/bundle/firetvRelease/*.aab dist/android/
          cp third_party/media-engine/out/android/source/*.tar dist/android/
          cp third_party/media-engine/out/android/notices/THIRD-PARTY-NOTICES.txt dist/android/
          printf '%s\n' "$GITHUB_SHA" > dist/android/SOURCE_COMMIT
          (cd dist/android && sha256sum *.apk *.aab *.tar THIRD-PARTY-NOTICES.txt SOURCE_COMMIT > SHA256SUMS)
          echo 'Release-mode testing builds signed with the repository development key; no store upload.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-and-fire-os
          path: dist/android/
          if-no-files-found: error
          retention-days: 14
