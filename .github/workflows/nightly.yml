name: Nightly
on:
  schedule:
    - cron: '37 3 * * *'
permissions:
  contents: read
  security-events: write

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: native-javascript-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: portico-react-native}
      # The shared packages here must match portico-server's, their source of truth, at the exact
      # commit they were copied from (packages/portico-server.lock.json), never a moving branch.
      - id: server
        run: echo "revision=$(node scripts/shared-packages.mjs --revision)" >> "$GITHUB_OUTPUT"
        working-directory: portico-react-native
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: PorticoMediaServer/portico-server, path: portico-server, ref: '${{ steps.server.outputs.revision }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: portico-react-native/.node-version, cache: npm, cache-dependency-path: portico-react-native/apps/native/package-lock.json}
      - run: node scripts/shared-packages.mjs --check
        working-directory: portico-react-native
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: portico-react-native/apps/native
      - run: npm run typecheck
        working-directory: portico-react-native/apps/native
      - run: npm run typecheck:next-test
        working-directory: portico-react-native/apps/native
      - name: Check hooks in the mounted application
        run: npx --no-install eslint --no-eslintrc -c .eslintrc.hooks.cjs --ext .ts,.tsx src-next App.tsx
        working-directory: portico-react-native/apps/native
      - name: Check mounted application copy
        run: |
          node ../../packages/i18n/scripts/lint-strings.mjs src-next scripts/next-strings-baseline.json --all --strict
          node ../../packages/i18n/scripts/lint-raw-errors.mjs src-next --strict
          node ../../packages/i18n/scripts/lint-glossary.mjs
        working-directory: portico-react-native/apps/native
      - name: Test the mounted application
        run: node --experimental-strip-types --import ./test/register.mjs --test test/next-*.test.ts
        working-directory: portico-react-native/apps/native
      # src is retained for compatibility, but App.tsx mounts src-next. Its
      # historical checks stay available at a checkpoint and remain mandatory
      # for release callers; they are not the source gate for the current app.
      - name: Retired application compatibility checkpoint
        if: true
        run: |
          npm run typecheck:test
          npm run lint:hooks
          npm run lint:strings
          node --experimental-strip-types --import ./test/register.mjs --test $(find test -maxdepth 1 -name '*.test.ts' ! -name 'next-*' -print)
        working-directory: portico-react-native/apps/native

  # The Vega app's own checks. Its package build needs Amazon's Vega SDK, which these runners do
  # not have; type checks, tests and strings need only its npm packages.
  vega:
    if: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: apps/vega/package-lock.json}
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: apps/vega
      - run: npm run typecheck
        working-directory: apps/vega
      - run: npm run typecheck:test
        working-directory: apps/vega
      - run: npm run lint:strings
        working-directory: apps/vega
      - run: npm test
        working-directory: apps/vega

  apple-contracts:
    runs-on: macos-15
    timeout-minutes: 10
    concurrency:
      group: apple-contracts-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the URL allowlist and download callback ownership
        run: |
          swiftc -O -o "$RUNNER_TEMP/portico-url-routes" apps/native/tvos/Portico/PorticoURLRoutes.swift apps/native/test/porticourlroutes-tests.swift
          "$RUNNER_TEMP/portico-url-routes"
          swiftc -D DEBUG -O -o "$RUNNER_TEMP/portico-url-routes-debug" apps/native/tvos/Portico/PorticoURLRoutes.swift apps/native/test/porticourlroutes-tests.swift
          "$RUNNER_TEMP/portico-url-routes-debug"
          clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/portico-download-attempts" apps/native/test/native-download-attempt-tests.m
          "$RUNNER_TEMP/portico-download-attempts"
          clang -fobjc-arc -framework Foundation -framework Security -o "$RUNNER_TEMP/portico-installation-storage" apps/native/test/native-installation-storage-tests.m
          "$RUNNER_TEMP/portico-installation-storage"
      - name: Public Reading stream Foundation tests
        env:
          PORTICO_APPLE_TEST_OUT_DIR: ${{ runner.temp }}/apple-reading
          CI: '1'
        run: bash apps/native/scripts/check-apple-reading-stream.sh
      - name: Public Foundation-only Reading and playback tests
        run: |
          set -euo pipefail
          for name in apple-presentation-readiness apple-subtitle-offset apple-subtitle-payload; do
            xcrun clang -fobjc-arc -fblocks -framework Foundation -framework AVFoundation "apps/native/test/${name}-tests.m" -o "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/$name"
          done
          xcrun clang -fobjc-arc -fblocks -framework Foundation -framework CoreVideo apps/native/test/apple-playback-observation-tests.m -o "$RUNNER_TEMP/apple-playback-observation"
          "$RUNNER_TEMP/apple-playback-observation"

  security:
    uses: ./.github/workflows/security.yml
    with: {nightly: true}

  summary:
    if: ${{ always() }}
    needs: [javascript, vega, apple-contracts, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Owned-machine media and hardware boundary
        run: echo 'Hosted nightly covers stateless checks. Source-built FFmpeg, media-heavy tests, devices and hardware run only on owned machines.' >> "$GITHUB_STEP_SUMMARY"
      - name: Nightly result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
