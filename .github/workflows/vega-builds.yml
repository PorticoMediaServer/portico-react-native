name: Vega builds

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: vega-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: apps/vega/package-lock.json}
      - name: Install the pinned vendor SDK without a virtual device
        run: bash scripts/install-vega-ci.sh
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: apps/vega
      - name: Build all three release packages with embedded JavaScript
        run: npm run build
        working-directory: apps/vega
      - name: Collect application packages only
        run: |
          mkdir -p dist/vega
          for architecture in aarch64 armv7 x86_64; do
            cp "apps/vega/build/$architecture-release/portico-vega_$architecture.vpkg" dist/vega/
          done
          printf '%s\n' "$GITHUB_SHA" > dist/vega/SOURCE_COMMIT
          (cd dist/vega && sha256sum *.vpkg SOURCE_COMMIT > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vega-release-packages
          path: dist/vega/
          if-no-files-found: error
          retention-days: 14
