name: Release

# Run the same complete platform suite, then collect its exact artifacts into a
# draft on version tags. Signing, notarization and store upload remain separate.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  draft:
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: android-and-fire-os, path: inputs/android}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: vega-release-packages, path: inputs/vega}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: Portico-ios-unsigned, path: inputs/ios}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {name: Portico-tvos-unsigned, path: inputs/tvos}
      - name: Preserve each platform's source, notices and checksums
        run: |
          mkdir -p dist
          for platform in android vega ios tvos; do
            test -n "$(find "inputs/$platform" -type f -print -quit)"
            tar -czf "dist/Portico-$platform-$GITHUB_REF_NAME.tar.gz" -C "inputs/$platform" .
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Portico apps $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA. Android/Fire OS use development signing; Apple archives are unsigned. Platform bundles preserve corresponding source, notices and checksums. Review store signing and device acceptance before publishing." \
            ./*
