name: Release

# Builds the apps for a release from one commit and drafts a GitHub release with them:
#
#  - the whole CI suite on that commit first (ci.yml, with portico-server at the recorded commit);
#  - Android: the media engine from pinned source, then release APKs and the App Bundle;
#  - Apple: the media engine, then unsigned iPhone/iPad and Apple TV archives;
#  - each platform's media-engine corresponding source bundle and notices (the LGPL asks for them
#    beside the app), and a SHA-256 list of everything attached.
#
# What stays by hand, because it needs credentials or tools these runners do not have: store
# signing (Android release builds are signed with the debug key until distribution is decided, see
# apps/native/android/app/build.gradle; Apple archives are unsigned), notarization and store
# upload, and the Vega package (`npm run build` in apps/vega needs Amazon's Vega SDK). The release
# is left as a draft for those to be added before it is published.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: apps/native/package-lock.json}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with: {distribution: temurin, java-version: '17'}
      - name: The NDK the app and the media engine are built with
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - name: Media engine from pinned source
        run: MEDIA_ENGINE_JOBS=4 third_party/media-engine/build-android.sh
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: apps/native
      - name: Release APKs and App Bundle
        run: ./gradlew --no-daemon assembleRelease bundleRelease
        working-directory: apps/native/android
      - name: Collect
        run: |
          mkdir -p dist
          find apps/native/android/app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          find apps/native/android/app/build/outputs/bundle/release -name '*.aab' -exec cp {} dist/ \;
          cp third_party/media-engine/out/android/source/*.tar dist/
          cp third_party/media-engine/out/android/notices/THIRD-PARTY-NOTICES.txt dist/media-engine-android-THIRD-PARTY-NOTICES.txt
          ls dist/*.apk dist/*.aab > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: android, path: dist/, if-no-files-found: error}

  apple:
    needs: checks
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: apps/native/package-lock.json}
      - name: Media engine from pinned source
        run: |
          brew list pkgconf > /dev/null 2>&1 || brew install pkgconf
          third_party/media-engine/build-apple.sh
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: apps/native
      - name: Unsigned archives (iPhone and iPad, Apple TV)
        run: |
          mkdir -p dist
          for platform in ios tvos; do
            sdk=iphoneos; [ "$platform" = tvos ] && sdk=appletvos
            (cd "apps/native/$platform" && pod install)
            xcodebuild -workspace "apps/native/$platform/Portico.xcworkspace" -scheme Portico -configuration Release \
              -sdk "$sdk" -archivePath "$RUNNER_TEMP/Portico-$platform.xcarchive" archive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
            ditto -c -k --keepParent "$RUNNER_TEMP/Portico-$platform.xcarchive" "dist/Portico-$platform-unsigned.xcarchive.zip"
          done
          cp third_party/media-engine/out/apple/source/*.tar dist/
          cp third_party/media-engine/out/apple/notices/THIRD-PARTY-NOTICES.txt dist/media-engine-apple-THIRD-PARTY-NOTICES.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: apple, path: dist/, if-no-files-found: error}

  draft:
    needs: [android, apple]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: {path: dist, merge-multiple: true}
      - name: Draft the release with every file and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Portico apps $GITHUB_REF_NAME" \
            --notes "Built from $GITHUB_SHA. Android builds are signed with the debug key and Apple archives are unsigned: sign for the stores, add the Vega package, then publish." \
            ./*
