name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: portico-react-native}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 24, cache: npm, cache-dependency-path: portico-react-native/package-lock.json}
      - run: npm ci --no-audit --no-fund
        working-directory: portico-react-native
      - run: npm run typecheck
        working-directory: portico-react-native
      - run: npm run lint
        working-directory: portico-react-native
      - run: npm test
        working-directory: portico-react-native
