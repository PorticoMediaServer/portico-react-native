name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {path: portico-react-native}
      # The shared packages here must match portico-server's, their source of truth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {repository: PorticoMediaServer/portico-server, path: portico-server}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24, cache: npm, cache-dependency-path: portico-react-native/apps/native/package-lock.json}
      - run: node scripts/shared-packages.mjs --check
        working-directory: portico-react-native
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: portico-react-native/apps/native
      - run: npm run typecheck
        working-directory: portico-react-native/apps/native
      - run: npm run lint:strings
        working-directory: portico-react-native/apps/native
      - run: npm test
        working-directory: portico-react-native/apps/native

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24, cache: npm, cache-dependency-path: apps/native/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: apps/native
      - name: Assemble the debug builds (phones and televisions, Fire OS)
        run: ./gradlew --no-daemon assembleDebug
        working-directory: apps/native/android
