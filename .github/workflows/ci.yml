name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional comparison commit (otherwise use origin/main)
        type: string
        required: false
        default: ''
      apple_reading_commit:
        description: Public-only Reading Foundation test source (full published commit)
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      legacy_compatibility:
        description: Compatibility now runs once nightly, not per merge
        type: boolean
        default: false
permissions:
  contents: read
env:
  CI_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
jobs:
  javascript:
    if: ${{ !inputs.apple_reading_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: native-merge-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: portico-react-native, fetch-depth: 0}
      - id: server
        run: echo "revision=$(node scripts/shared-packages.mjs --revision)" >> "$GITHUB_OUTPUT"
        working-directory: portico-react-native
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: PorticoMediaServer/portico-server, path: portico-server, ref: '${{ steps.server.outputs.revision }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: portico-react-native/.node-version, cache: npm, cache-dependency-path: portico-react-native/apps/native/package-lock.json}
      - run: node scripts/shared-packages.mjs --check
        working-directory: portico-react-native
      - run: python3 scripts/test-ci-affected.py
        working-directory: portico-react-native
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: portico-react-native/apps/native
      - name: Mounted source and test types
        run: npm run typecheck && npm run typecheck:next-test
        working-directory: portico-react-native/apps/native
      - if: ${{ !cancelled() }}
        name: Affected tests plus mandatory sign-in/session/account/profile guards
        run: python3 scripts/ci-affected.py native-js
        working-directory: portico-react-native

  apple-contracts:
    runs-on: macos-15
    timeout-minutes: 10
    concurrency:
      group: apple-contracts-${{ github.workflow }}-${{ inputs.apple_reading_commit || github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - name: Validate requested public test source
        if: ${{ inputs.apple_reading_commit != '' }}
        env:
          SOURCE_COMMIT: ${{ inputs.apple_reading_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.apple_reading_commit || github.sha }}
          persist-credentials: false
      - name: Public Reading stream Foundation tests
        if: ${{ inputs.apple_reading_commit != '' }}
        env:
          PORTICO_APPLE_TEST_OUT_DIR: ${{ runner.temp }}/apple-reading
          CI: '1'
        run: bash apps/native/scripts/check-apple-reading-stream.sh
      - name: Check the URL allowlist and download callback ownership
        if: ${{ !inputs.apple_reading_commit }}
        run: |
          swiftc -O -o "$RUNNER_TEMP/portico-url-routes" apps/native/tvos/Portico/PorticoURLRoutes.swift apps/native/test/porticourlroutes-tests.swift
          "$RUNNER_TEMP/portico-url-routes"
          clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/portico-download-attempts" apps/native/test/native-download-attempt-tests.m
          "$RUNNER_TEMP/portico-download-attempts"
          clang -fobjc-arc -framework Foundation -framework Security -o "$RUNNER_TEMP/portico-installation-storage" apps/native/test/native-installation-storage-tests.m
          "$RUNNER_TEMP/portico-installation-storage"
      - name: Public Foundation-only Reading and playback tests
        if: ${{ !inputs.apple_reading_commit }}
        run: |
          set -euo pipefail
          for name in apple-reading-bytes apple-presentation-readiness apple-subtitle-offset apple-subtitle-payload; do
            xcrun clang -fobjc-arc -fblocks -framework Foundation -framework AVFoundation "apps/native/test/${name}-tests.m" -o "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/$name"
          done
          xcrun clang -fobjc-arc -fblocks -framework Foundation -framework CoreVideo apps/native/test/apple-playback-observation-tests.m -o "$RUNNER_TEMP/apple-playback-observation"
          "$RUNNER_TEMP/apple-playback-observation"
