name: CI
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      apple_reading_commit:
        description: Public-only Reading Foundation test source (full published commit)
        type: string
        required: false
        default: ''
  workflow_call:
permissions:
  contents: read
concurrency:
  # Finish the active run so its full test inventory produces results. GitHub
  # coalesces later requests into one pending run for this repository.
  group: ci-${{ github.repository }}
  cancel-in-progress: false
env:
  CI_FULL_TREE: '1'
jobs:
  # Source, mounted types and the required lint run once. They do not depend on
  # the test shard, so paying for them in every shard would only add cost.
  javascript-checks:
    if: ${{ !inputs.apple_reading_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: portico-react-native, fetch-depth: 0}
      - id: server
        run: echo "revision=$(node scripts/shared-packages.mjs --revision)" >> "$GITHUB_OUTPUT"
        working-directory: portico-react-native
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: PorticoMediaServer/portico-server, path: portico-server, ref: '${{ steps.server.outputs.revision }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: portico-react-native/.node-version, cache: npm, cache-dependency-path: portico-react-native/apps/native/package-lock.json}
      - name: Record the actual job toolchain
        run: |
          echo "node $(node --version) (pinned $(cat portico-react-native/.node-version))"
          if command -v go >/dev/null 2>&1; then echo "$(go version) (not used by this job)"; else echo "go unavailable (not used by this job)"; fi
      - run: node scripts/shared-packages.mjs --check
        working-directory: portico-react-native
      - name: Selection, test-runner and platform-inventory regressions
        run: |
          status=0
          python3 scripts/test-ci-affected.py || status=1
          python3 scripts/test-platform-tests.py || status=1
          exit "$status"
        working-directory: portico-react-native
      - id: native-deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: portico-react-native/apps/native
      - name: Mounted source and test types
        run: |
          status=0
          npm run typecheck > "$RUNNER_TEMP/types-source.log" 2>&1 || status=1
          npm run typecheck:next-test > "$RUNNER_TEMP/types-tests.log" 2>&1 || status=1
          tail -n 20 "$RUNNER_TEMP/types-source.log"
          tail -n 20 "$RUNNER_TEMP/types-tests.log"
          exit "$status"
        working-directory: portico-react-native/apps/native
      - if: ${{ !cancelled() && steps.native-deps.outcome == 'success' }}
        name: Mounted application lint (required)
        run: |
          status=0
          npm run lint:boundary || status=1
          npx --no-install eslint --no-eslintrc -c .eslintrc.hooks.cjs --ext .ts,.tsx src-next App.tsx || status=1
          node ../../packages/i18n/scripts/lint-strings.mjs src-next scripts/next-strings-baseline.json --all --strict || status=1
          node ../../packages/i18n/scripts/lint-raw-errors.mjs src-next --strict || status=1
          node ../../packages/i18n/scripts/lint-glossary.mjs || status=1
          exit "$status"
        working-directory: portico-react-native/apps/native
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-javascript-checks-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

  # The whole selected test tree, split into deterministic shards. Every selected
  # file — mandatory security guards included — belongs to exactly one shard, and
  # any failing or hung shard fails the workflow. Each shard runs one file per
  # process, so a hang is named and the rest of that shard still reports.
  javascript-tests:
    if: ${{ !inputs.apple_reading_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: portico-react-native, fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: portico-react-native/.node-version, cache: npm, cache-dependency-path: portico-react-native/apps/native/package-lock.json}
      - name: Record the actual job toolchain
        run: |
          echo "node $(node --version) (pinned $(cat portico-react-native/.node-version))"
          if command -v go >/dev/null 2>&1; then echo "$(go version) (not used by this job)"; else echo "go unavailable (not used by this job)"; fi
      - id: native-deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: portico-react-native/apps/native
      - if: ${{ !cancelled() && steps.native-deps.outcome == 'success' }}
        name: Full-tree tests plus mandatory sign-in/session/account/profile guards
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_TOTAL: '4'
          CI_TEST_REPORT_DIR: ${{ runner.temp }}/ci-report
        run: |
          status=0
          python3 scripts/ci-affected.py native-js > "$RUNNER_TEMP/full-ci.log" 2>&1 || status=$?
          tail -n 40 "$RUNNER_TEMP/full-ci.log"
          exit "$status"
        working-directory: portico-react-native
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-javascript-tests-${{ matrix.shard }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/ci-report/**
          if-no-files-found: ignore
          retention-days: 7

  android-tests:
    if: ${{ !inputs.apple_reading_commit }}
    uses: ./.github/workflows/android-tests.yml

  # The Vega app's own checks. Its package build needs Amazon's Vega SDK, which these runners do
  # not have; type checks, tests and strings need only its npm packages.
  vega:
    if: ${{ !inputs.apple_reading_commit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version, cache: npm, cache-dependency-path: apps/vega/package-lock.json}
      - id: vega-deps
        run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: apps/vega
      - if: ${{ !cancelled() && steps.vega-deps.outcome == 'success' }}
        run: npm run typecheck
        working-directory: apps/vega
      - if: ${{ !cancelled() && steps.vega-deps.outcome == 'success' }}
        run: npm run typecheck:test
        working-directory: apps/vega
      - if: ${{ !cancelled() && steps.vega-deps.outcome == 'success' }}
        run: npm run lint:strings
        working-directory: apps/vega
      - if: ${{ !cancelled() && steps.vega-deps.outcome == 'success' }}
        run: npm test
        working-directory: apps/vega

  apple-contracts:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Validate requested public test source
        if: ${{ inputs.apple_reading_commit != '' }}
        env:
          SOURCE_COMMIT: ${{ inputs.apple_reading_commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.apple_reading_commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the actual job toolchain
        run: |
          if command -v node >/dev/null 2>&1; then echo "node $(node --version) (not used by this job)"; else echo "node unavailable (not used by this job)"; fi
          if command -v go >/dev/null 2>&1; then echo "$(go version) (not used by this job)"; else echo "go unavailable (not used by this job)"; fi
          swiftc --version
          clang --version | head -n 1
          xcodebuild -version | head -n 1
      - name: Public Reading stream Foundation tests
        if: ${{ inputs.apple_reading_commit != '' }}
        env:
          PORTICO_APPLE_TEST_OUT_DIR: ${{ runner.temp }}/apple-reading
          CI: '1'
        run: bash apps/native/scripts/check-apple-reading-stream.sh
      - name: Check the URL allowlist and download callback ownership
        if: ${{ !inputs.apple_reading_commit }}
        run: |
          swiftc -O -o "$RUNNER_TEMP/portico-url-routes" apps/native/tvos/Portico/PorticoURLRoutes.swift apps/native/test/porticourlroutes-tests.swift
          "$RUNNER_TEMP/portico-url-routes"
          swiftc -D DEBUG -O -o "$RUNNER_TEMP/portico-url-routes-debug" apps/native/tvos/Portico/PorticoURLRoutes.swift apps/native/test/porticourlroutes-tests.swift
          "$RUNNER_TEMP/portico-url-routes-debug"
          clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/portico-download-attempts" apps/native/test/native-download-attempt-tests.m
          "$RUNNER_TEMP/portico-download-attempts"
          clang -fobjc-arc -framework Foundation -framework Security -o "$RUNNER_TEMP/portico-installation-storage" apps/native/test/native-installation-storage-tests.m
          "$RUNNER_TEMP/portico-installation-storage"
      - name: All Reading stream Foundation tests
        if: ${{ !inputs.apple_reading_commit }}
        env:
          PORTICO_APPLE_TEST_OUT_DIR: ${{ runner.temp }}/apple-reading
          CI: '1'
        run: bash apps/native/scripts/check-apple-reading-stream.sh
      - name: Complete Apple test inventory
        if: ${{ !inputs.apple_reading_commit }}
        run: python3 scripts/platform-tests.py inventory
      - name: Manifest-listed Foundation tests
        if: ${{ !inputs.apple_reading_commit }}
        run: python3 scripts/platform-tests.py foundation --output "$RUNNER_TEMP/apple-foundation"
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/apple-foundation/**
            ${{ runner.temp }}/apple-reading/**
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7


  # Keep the existing branch-protection context, backed by every real shard.
  javascript:
    if: ${{ always() && !inputs.apple_reading_commit }}
    needs: [javascript-checks, javascript-tests, android-tests, vega]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require mounted checks and every test shard
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = {name: row['result'] for name, row in json.loads(os.environ['RESULTS']).items()}
          print(results)
          raise SystemExit(any(result != 'success' for result in results.values()))
          PYCODE
