apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Debug variants load JavaScript from Metro; Release variants embed the bundle.
    debuggableVariants = ["googleDebug", "firetvDebug"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// The app's own C++ (React Native's app modules and the libraries' generated code) names source
// files in its asserts. Those names are mapped to neutral ones, so a release library carries no
// folder of the machine that built it: the checkout, node_modules (also through a link) and
// Gradle's cache, where React Native's headers are unpacked. A folder with a space cannot be
// passed this way (CMake splits the flags at spaces) and is left as it is.
def neutralPathFlags = { Map<File, String> folders ->
    folders.collectMany { folder, neutral ->
        [folder.absolutePath, folder.canonicalPath].unique().findAll { !(it =~ /\s/) }.collect { "-ffile-prefix-map=${it}=${neutral}".toString() }
    }
}
def appPathFlags = neutralPathFlags([
    (rootProject.file("../../..")): "/portico",
    (rootProject.file("../node_modules")): "/portico/apps/native/node_modules",
    (gradle.gradleUserHomeDir): "/gradle",
])

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "tv.getportico.portico"
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // One application for phones and televisions; `Platform.isTV` chooses the layout.
        applicationId "tv.getportico.portico"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders += [
            porticoHostedUrl        : (project.findProperty("porticoHostedUrl") ?: ""),
            porticoCastApplicationId: (project.findProperty("porticoCastApplicationId") ?: ""),
        ]
        externalNativeBuild {
            cmake {
                cFlags(*appPathFlags)
                cppFlags(*appPathFlags)
            }
        }
    }
    buildFeatures { buildConfig true }

    // `google` is Android and Android TV; `firetv` is Fire OS, which has no Google Play services.
    flavorDimensions "store"
    productFlavors {
        google { dimension "store" }
        firetv {
            dimension "store"
            minSdkVersion 25
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Not signed for a store: release builds use the debug keystore until distribution is decided.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    // Both JNI consumers resolve these imports from the same checked engineDir.
    packagingOptions { jniLibs { pickFirsts += ["**/libavcodec.so","**/libavformat.so","**/libavutil.so","**/libswresample.so","**/libass.so"] } }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("generated/portico/assets")
    }

    // One APK carries every architecture in `reactNativeArchitectures`, as before. The mpv engine
    // adds roughly 8 MB of download per architecture, so a build for sideloading or a store that
    // takes APKs can be split: -PporticoAbiSplits=true also writes one APK per architecture
    // beside the universal one. (An app bundle is split by the store without this.)
    splits {
        abi {
            enable project.findProperty("porticoAbiSplits")?.toString() == "true"
            reset()
            include(*((project.findProperty("reactNativeArchitectures") ?: "armeabi-v7a,arm64-v8a,x86,x86_64").toString().split(",").collect { it.trim() }))
            universalApk true
        }
    }
}

// The typefaces live once, in ../assets. React Native looks a `fontFamily` up as
// assets/fonts/<name>.ttf, so they are copied under the names the theme uses.
def porticoFonts = tasks.register("porticoFonts", Copy) {
    def names = [
        "manrope-400.ttf": "Manrope-Regular.ttf",
        "manrope-500.ttf": "Manrope-Medium.ttf",
        "manrope-600.ttf": "Manrope-SemiBold.ttf",
        "manrope-700.ttf": "Manrope-Bold.ttf",
        "manrope-800.ttf": "Manrope-ExtraBold.ttf",
    ]
    from("../../assets") { include names.keySet() }
    into(layout.buildDirectory.dir("generated/portico/assets/fonts"))
    rename { names[it] }
}
preBuild.dependsOn(porticoFonts)

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // The bounded control transport (PorticoRuntime).
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    // The player (PorticoPlaybackModule, PorticoPlayer) and the system media session.
    def media3 = "1.10.1"
    implementation("androidx.media3:media3-exoplayer:$media3")
    implementation("androidx.media3:media3-exoplayer-hls:$media3")
    implementation("androidx.media3:media3-datasource-okhttp:$media3")
    implementation("androidx.media3:media3-session:$media3")
    // The second player engine: libmpv (source-built GPL bundle) and its JNI bridge. See portico-mpv/build.gradle.
    implementation project(":portico-mpv")
    implementation project(":portico-media")
    // Google Cast: only in the build for devices with Google Play services (never Fire OS).
    googleImplementation "com.google.android.gms:play-services-cast-framework:22.1.0"
    // The provider sign-in browser (PorticoAccountAuth).
    implementation("androidx.browser:browser:1.8.0")
    // Curve25519 and byte-oriented PBKDF2/HKDF, used through the lightweight API only (no JCA
    // provider is registered): the platform has neither on the Android versions Portico supports.
    implementation("org.bouncycastle:bcprov-jdk18on:1.86")

    // JVM unit tests of the logic that needs no device (app/src/test): never in the app.
    //   ./gradlew :app:testGoogleDebugUnitTest
    testImplementation("junit:junit:4.13.2")
    androidTestImplementation("androidx.test:runner:1.6.2")
    androidTestImplementation("androidx.test.ext:junit:1.2.1")
}

// Open-source licences (Settings › About). apps/native/licences/android-<flavour>.txt pin each
// flavour's release runtime classpath; apps/native/scripts/licences.mts turns them into the list
// the app shows. A release build stops when its classpath no longer matches the pinned list, so
// the list cannot fall behind a dependency change. To update after a change:
//   ./gradlew :app:recordReleaseDependencies
//   node --experimental-strip-types apps/native/scripts/licences.mts   (from the repository root)
def licenceLists = rootProject.file("../licences")
def runtimeModules = { Configuration configuration ->
    def found = new TreeSet<String>()
    def seen = new HashSet<String>()
    def walk
    walk = { org.gradle.api.artifacts.result.ResolvedComponentResult component ->
        if (!seen.add(component.id.displayName)) return
        // A platform (a BOM) only aligns versions; it ships nothing.
        def platform = component.variants.any { v -> v.attributes.keySet().any { k -> k.name == "org.gradle.category" && (v.attributes.getAttribute(k)?.toString() in ["platform", "enforced-platform"]) } }
        if (component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier && !platform) {
            found << "${component.id.group}:${component.id.module}:${component.id.version}".toString()
        }
        component.dependencies.each { d -> if (d instanceof org.gradle.api.artifacts.result.ResolvedDependencyResult) walk(d.selected) }
    }
    walk(configuration.incoming.resolutionResult.root)
    found
}
def licenceListHeader = { String flavour -> """# The ${flavour} flavour's release runtime classpath (Maven artifacts; project modules left out).
# Written by ./gradlew :app:recordReleaseDependencies and checked before every release build
# (app/build.gradle). After a change: record, then node --experimental-strip-types apps/native/scripts/licences.mts.
""" }
def recordTasks = []
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        def flavour = variant.flavorName
        def configuration = variant.runtimeConfiguration
        def list = new File(licenceLists, "android-${flavour}.txt")
        def suffix = variant.name.capitalize()
        def check = tasks.register("check${suffix}OpenSourceLicences") {
            group = "verification"
            description = "Fails when the ${flavour} release dependencies differ from apps/native/licences/android-${flavour}.txt."
            inputs.file(list)
            doLast {
                def pinned = (list.readLines()*.trim().findAll { it && !it.startsWith("#") }) as Set
                def resolved = runtimeModules(configuration)
                def added = resolved - pinned
                def removed = pinned - resolved
                if (added || removed) {
                    throw new GradleException("The ${flavour} release build's libraries changed, so the open-source licence list is out of date." +
                        (added ? "\n  New: ${added.join(', ')}" : "") + (removed ? "\n  Gone: ${removed.join(', ')}" : "") +
                        "\nRun ./gradlew :app:recordReleaseDependencies, then node --experimental-strip-types apps/native/scripts/licences.mts from the repository root, and commit both.")
                }
            }
        }
        recordTasks << tasks.register("record${suffix}Dependencies") {
            description = "Writes apps/native/licences/android-${flavour}.txt from the ${flavour} release runtime classpath."
            doLast { list.text = licenceListHeader(flavour) + runtimeModules(configuration).join("\n") + "\n" }
        }
        tasks.matching { it.name == "pre${suffix}Build" }.configureEach { dependsOn(check) }
    }
}
tasks.register("recordReleaseDependencies") {
    description = "Writes apps/native/licences/android-<flavour>.txt for every flavour's release build."
    dependsOn(recordTasks)
}
