import groovy.json.JsonSlurper

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // RN-003: this app is an npm workspace. Keep the JS root at the app
    // package, but resolve React Native tooling from the workspace hoist.
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")
    hermesCommand = file("../../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc").absolutePath

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// RN-002: the Foundation release identity is the sole version authority. CI
// release inputs may stamp the same identity, but no Android-only version
// authority or legacy environment alias is accepted.
def porticoReleaseIdentityFile = file("../../../../../../foundation/release/release-identity.json")
if (!porticoReleaseIdentityFile.isFile()) {
    throw new GradleException("Foundation release identity is missing: ${porticoReleaseIdentityFile}")
}
def porticoReleaseIdentity = new JsonSlurper().parse(porticoReleaseIdentityFile)
def porticoReleaseVersionInput = System.getenv('PORTICO_VERSION')?.trim()
def porticoReleaseBuildNumberInput = System.getenv('PORTICO_BUILD_NUMBER')?.trim()
def porticoReleaseVersion = (porticoReleaseVersionInput ?: porticoReleaseIdentity.version?.toString()?.trim())
def porticoReleaseBuildNumber = (porticoReleaseBuildNumberInput ?: porticoReleaseIdentity.buildNumber?.toString()?.trim())
def porticoReleaseVersionValid = porticoReleaseVersion ==~ /^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/
def porticoReleaseBuildNumberValid = porticoReleaseBuildNumber ==~ /^(0|[1-9][0-9]{0,11})$/
if (!porticoReleaseVersionValid || !porticoReleaseBuildNumberValid) {
    throw new GradleException('Foundation release identity has an invalid version or build number.')
}
// Android requires a positive versionCode. Development identity buildNumber
// 0 therefore projects to the minimum debug code; protected releases require
// a positive externally supplied build number and use it exactly.
def porticoAndroidVersionCode = Math.max(1, Integer.parseInt(porticoReleaseBuildNumber))

// RN-002: release signing is an external protected input. A release variant
// must never fall back to the Android debug key or a committed keystore.
def releaseSigningValue = { String propertyName, String environmentName ->
    def propertyValue = project.findProperty(propertyName)
    def environmentValue = System.getenv(environmentName)
    def value = propertyValue ?: environmentValue
    return value?.toString()?.trim()
}

def releaseStoreFile = releaseSigningValue('porticoReleaseStoreFile', 'PORTICO_ANDROID_RELEASE_STORE_FILE')
def releaseStorePassword = releaseSigningValue('porticoReleaseStorePassword', 'PORTICO_ANDROID_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = releaseSigningValue('porticoReleaseKeyAlias', 'PORTICO_ANDROID_RELEASE_KEY_ALIAS')
def releaseKeyPassword = releaseSigningValue('porticoReleaseKeyPassword', 'PORTICO_ANDROID_RELEASE_KEY_PASSWORD')
def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def sharedAndroidPlayerSource = file('../../../../packages/player/android/src/main/java')

def verifyReleaseIdentity = tasks.register('verifyReleaseIdentity') {
    group = 'verification'
    description = 'Fails closed unless the protected Foundation version/build identity is supplied.'
    doLast {
        if (!porticoReleaseVersionInput || !porticoReleaseBuildNumberInput) {
            throw new GradleException(
                'Protected release identity is not configured. Supply PORTICO_VERSION and ' +
                    'PORTICO_BUILD_NUMBER from the governed Foundation release identity input.'
            )
        }
        if (!(porticoReleaseVersionInput ==~ /^[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$/)) {
            throw new GradleException('PORTICO_VERSION is not a valid release version.')
        }
        if (!(porticoReleaseBuildNumberInput ==~ /^[1-9][0-9]{0,11}$/)) {
            throw new GradleException('PORTICO_BUILD_NUMBER must be a positive monotonic release number.')
        }
    }
}

def verifyReleaseSigning = tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails closed unless protected Portico release signing inputs are supplied.'
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException(
                'Protected release signing is not configured. Supply PORTICO_ANDROID_RELEASE_STORE_FILE, ' +
                    'PORTICO_ANDROID_RELEASE_STORE_PASSWORD, PORTICO_ANDROID_RELEASE_KEY_ALIAS, and ' +
                    'PORTICO_ANDROID_RELEASE_KEY_PASSWORD through CI or an untracked Gradle property.'
            )
        }
        if (!file(releaseStoreFile).isFile()) {
            throw new GradleException('Protected release signing store does not exist: ' + releaseStoreFile)
        }
    }
}

tasks.configureEach { task ->
    if (task.name ==~ /^(assemble|bundle|package).+Release$/) {
        task.dependsOn(verifyReleaseSigning, verifyReleaseIdentity)
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "tv.getportico.android"
    defaultConfig {
        applicationId "tv.getportico.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode porticoAndroidVersionCode
        versionName porticoReleaseVersion
    }
    flavorDimensions "runtime"
    productFlavors {
        mobile {
            dimension "runtime"
            applicationId "tv.getportico.android"
            manifestPlaceholders = [porticoRuntimeFamily: "android-mobile", usesCleartextTraffic: "false"]
        }
        fireTv {
            dimension "runtime"
            applicationId "tv.getportico.firetv"
            manifestPlaceholders = [porticoRuntimeFamily: "fire-tv", usesCleartextTraffic: "false"]
        }
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {}
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    sourceSets {
        main.java.srcDir(sharedAndroidPlayerSource)
        main.kotlin.srcDir(sharedAndroidPlayerSource)
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.media3:media3-exoplayer:1.10.1")
    implementation("androidx.media3:media3-exoplayer-hls:1.10.1")
    implementation("androidx.media3:media3-ui:1.10.1")
    implementation("androidx.media3:media3-session:1.10.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
